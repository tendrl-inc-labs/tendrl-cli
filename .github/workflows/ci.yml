name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor; 3.14 is current CPython.
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Import on the declared floor
        run: python -c "import tendrl_cli; print('tendrl_cli', tendrl_cli.__version__)"

      - name: CLI entry point resolves
        run: tendrl-cli --version

      - name: Test
        run: pytest -q

      # A suite that collects nothing must not report success.
      - name: Tests must have run
        run: |
          count=$(pytest --collect-only -q 2>/dev/null | grep -cE '::') || true
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::no tests were collected"
            exit 1
          fi
          echo "collected $count test(s)"
