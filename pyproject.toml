[project]
name = "tendrl-cli"
version = "0.1.0"
description = "Command-line interface for the Tendrl platform: Contact, Strand, and Surface."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tendrl", email = "support@tendrl.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
tendrl-cli = "tendrl_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tendrl_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
